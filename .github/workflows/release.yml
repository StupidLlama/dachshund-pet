# 推 v* tag（例如 v0.4.4）→ 跑測試 → 在 Windows 打包 → 上傳 DachshundPet-windows.zip 到 Releases。
# 也可以在 GitHub 的 Actions 頁按「Run workflow」手動打包（只產生下載檔，不發 Release）。
name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (fake PySide6 + local fake Firebase)
        run: |
          python tests/test_v03.py
          python tests/test_v04_pet.py
          python tests/test_v04_cloud.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Icon
        run: python -c "from PIL import Image; Image.open('assets/icon.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: PyInstaller (folder version, starts fast)
        run: pyinstaller main.py --noconfirm --windowed --name DachshundPet --icon icon.ico --exclude-module PIL
      - name: Put assets and Firebase config next to the exe (easy to swap pictures)
        shell: pwsh
        run: |
          $out = "dist/DachshundPet"
          Copy-Item assets "$out/assets" -Recurse
          New-Item -ItemType Directory "$out/firebase" | Out-Null
          Copy-Item firebase/config.json "$out/firebase/"
          Compress-Archive -Path $out -DestinationPath DachshundPet-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DachshundPet-windows
          path: DachshundPet-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DachshundPet-windows.zip
          generate_release_notes: true
